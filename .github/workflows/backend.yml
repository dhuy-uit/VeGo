name: Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Build + test tích hợp (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify
        run: mvn -B -ntp verify
      - name: Lưu báo cáo test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore

  postman:
    name: Kiểm thử API bằng Postman (Newman)
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vego
          POSTGRES_USER: vego
          POSTGRES_PASSWORD: vego
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vego -d vego"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build jar
        run: mvn -B -ntp -DskipTests package
      - name: Chạy API
        env:
          EXPOSE_RESET_TOKEN: "true"
          JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-123
        run: |
          nohup java -jar target/vego-backend.jar > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          cat api.log; exit 1
      - name: Newman
        run: |
          npm install -g newman@6 newman-reporter-htmlextra@1
          newman run postman/VeGo.postman_collection.json \
            -e postman/VeGo-Local.postman_environment.json \
            --working-dir postman \
            -r cli,htmlextra --reporter-htmlextra-export newman-report.html \
            --reporter-htmlextra-title "VéGo API - Kết quả kiểm thử"
      - name: Lưu báo cáo Newman + log API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-report
          path: |
            backend/newman-report.html
            backend/api.log

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t vego-backend:ci .
