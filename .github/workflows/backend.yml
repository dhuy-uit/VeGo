name: Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Build + test tích hợp (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify
        run: mvn -B -ntp verify
      - name: Tóm tắt lỗi test (annotation)
        if: failure()
        run: |
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] && grep -q "FAIL" "$f" && echo "::error title=$(basename $f)::$(head -60 "$f" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          done
          true
      - name: Lưu báo cáo test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore

  postman:
    name: Kiểm thử API bằng Postman (Newman)
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vego
          POSTGRES_USER: vego
          POSTGRES_PASSWORD: vego
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vego -d vego"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build jar
        run: mvn -B -ntp -DskipTests package
      - name: Chạy API
        env:
          EXPOSE_RESET_TOKEN: "true"
          JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-123
        run: |
          nohup java -jar target/vego-backend.jar > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          cat api.log; exit 1
      - name: Newman
        run: |
          npm install -g newman@6 newman-reporter-htmlextra@1
          newman run postman/VeGo.postman_collection.json \
            -e postman/VeGo-Local.postman_environment.json \
            --working-dir postman \
            -r cli,json,htmlextra --reporter-json-export newman.json \
            --reporter-htmlextra-export newman-report.html \
            --reporter-htmlextra-title "VéGo API - Kết quả kiểm thử"
      - name: Tóm tắt kết quả (annotation)
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("newman.json")) { console.log("::error title=Newman::Không có newman.json"); process.exit(0); }
            const r = JSON.parse(fs.readFileSync("newman.json", "utf8")).run;
            const s = r.stats;
            const lines = r.failures.map(f => `${f.source && f.source.name} | ${f.error.test || f.error.name}: ${f.error.message}`);
            const head = `requests ${s.requests.total}/${s.requests.failed} fail, assertions ${s.assertions.total}/${s.assertions.failed} fail`;
            const esc = t => t.replace(/%/g, "%25").replace(/\r/g, "").replace(/\n/g, "%0A");
            console.log(`::${r.failures.length ? "error" : "notice"} title=Newman::${esc([head, ...lines].join("\n"))}`);
          '
          if [ -f api.log ] && grep -q "ERROR" api.log; then
            echo "::warning title=api.log::$(grep -A3 ERROR api.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
      - name: Lưu báo cáo Newman + log API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-report
          path: |
            backend/newman-report.html
            backend/api.log

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t vego-backend:ci .
