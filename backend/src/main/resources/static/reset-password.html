<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VéGo · Đặt lại mật khẩu</title>
<style>
  :root { --primary:#007F78; --text:#173536; --muted:#647A7C; --mint:#E4F4F1; --bg:#F5F8F8; --danger:#C2412D; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:16px; }
  .card { width:100%; max-width:400px; background:#fff; border-radius:20px; padding:28px 24px;
          box-shadow:0 8px 30px rgba(23,53,54,.08); }
  .logo { font-weight:800; font-size:24px; color:var(--primary); letter-spacing:-.5px; }
  h1 { font-size:20px; margin:18px 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
  input { width:100%; height:48px; border:1px solid #D6E2E2; border-radius:12px; padding:0 14px; font-size:15px; color:var(--text); }
  input:focus { outline:2px solid var(--primary); border-color:transparent; }
  .rule { font-size:12px; color:var(--muted); margin-top:6px; }
  button { margin-top:22px; width:100%; height:50px; border:0; border-radius:14px; background:var(--primary);
           color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .msg { margin-top:16px; padding:12px 14px; border-radius:12px; font-size:14px; display:none; }
  .msg.ok { display:block; background:var(--mint); color:var(--primary); }
  .msg.err { display:block; background:#FCECE9; color:var(--danger); }
</style>
</head>
<body>
<main class="card">
  <div class="logo">VéGo</div>
  <h1>Đặt lại mật khẩu</h1>
  <p class="sub">Tạo mật khẩu mới cho tài khoản VéGo của bạn.</p>
  <form id="form" novalidate>
    <label for="pw">Mật khẩu mới</label>
    <input id="pw" type="password" autocomplete="new-password" required>
    <div class="rule">Tối thiểu 8 ký tự, gồm chữ hoa, chữ thường và số.</div>
    <label for="pw2">Nhập lại mật khẩu mới</label>
    <input id="pw2" type="password" autocomplete="new-password" required>
    <button id="btn" type="submit">Cập nhật mật khẩu</button>
  </form>
  <div id="msg" class="msg" role="status"></div>
</main>
<script>
  const token = new URLSearchParams(location.search).get('token');
  const form = document.getElementById('form'), btn = document.getElementById('btn'), msg = document.getElementById('msg');
  function show(text, ok) { msg.textContent = text; msg.className = 'msg ' + (ok ? 'ok' : 'err'); }
  if (!token) { show('Liên kết khôi phục không hợp lệ. Hãy yêu cầu gửi lại từ ứng dụng VéGo.', false); btn.disabled = true; }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = document.getElementById('pw').value, pw2 = document.getElementById('pw2').value;
    if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,72}$/.test(pw)) return show('Mật khẩu mới cần tối thiểu 8 ký tự, gồm chữ hoa, chữ thường và số.', false);
    if (pw !== pw2) return show('Mật khẩu xác nhận chưa khớp.', false);
    btn.disabled = true; btn.textContent = 'Đang cập nhật...';
    try {
      const res = await fetch('api/v1/auth/reset-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword: pw })
      });
      const body = await res.json().catch(() => ({}));
      if (res.ok) { show(body.message || 'Đã đặt lại mật khẩu.', true); form.style.display = 'none'; }
      else { show(body.message || 'Không đặt lại được mật khẩu.', false); btn.disabled = false; }
    } catch (err) { show('Không kết nối được máy chủ, vui lòng thử lại.', false); btn.disabled = false; }
    btn.textContent = 'Cập nhật mật khẩu';
  });
</script>
</body>
</html>
